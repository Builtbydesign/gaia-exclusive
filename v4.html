      stroke-linejoin: round;
    }
    .text-reveal {
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .text-reveal.active {
      clip-path: inset(0 0% 0 0);
    }
    .text-reveal.exit {
      clip-path: inset(0 0% 0 100%);
    }
    li {list-style: none;}
    ul#places {
      font-family: 'Montserrat-Regular';
      margin: -60px 0 0 0;
      padding: 0;
      line-height: 24px;
      position: relative;
      z-index: 999;
      text-align: right;
      width: 200px;
    }
    ul li a {font-size: 1em; text-decoration: none;
      cursor: pointer; display: block;}
      #content {
        overflow: hidden;
        position: relative;
        transition: none;
        padding: 12px;
      }
      #content-inner {
        display: block;
        clip-path: inset(0 0% 0 0);
        transition: clip-path 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        padding: inherit;
      }
      #content-inner.swipe-out {
        clip-path: inset(0 0% 0 100%);
      }
      #content-inner.swipe-in {
        clip-path: inset(0 100% 0 0);
      }
      #content-inner.swipe-in-active {
        clip-path: inset(0 0% 0 0);
      }
      #content img {
        width: 100%;
        max-width: 300px;
      }
    </style>

    <script src="js/marked.js"></script>
    <script>
     let current = null;
     const cache = {};
     const contentWrap = document.getElementById('content');
     const inner = document.getElementById('content-inner');

     function setInnerHTML(html) {
      inner.innerHTML = html;
    }

    function transitionTo(page, push = true) {
      if (page === current) return;
      const prev = current;
      current = page;

      resetAnimation();

      inner.classList.remove('swipe-in', 'swipe-in-active');
      inner.classList.add('swipe-out');

      setTimeout(async () => {
       const html = await load(page);
       setInnerHTML(html);

       inner.classList.remove('swipe-out');
       inner.classList.add('swipe-in');
       void inner.offsetWidth;

       inner.classList.remove('swipe-in');
       inner.classList.add('swipe-in-active');

       if (push) history.pushState(null, '', `#!${page}`);
     }, 350);      }

      async function load(page) {
        if (cache[page]) return cache[page];
        try {
          const res = await fetch(`pages/${page}.md`);
          if (!res.ok) throw new Error();
          let text = await res.text();
          text = text.replace(/^---[\s\S]*?---\n/, '');
          const html = marked(text);
          cache[page] = html;
          return html;
        } catch {
          const fallback = marked(`# 404\n\nPage not found. [Home](#!home).`);
          cache[page] = fallback;
          return fallback;
        }
      }

      document.addEventListener('click', e => {
        const link = e.target.closest('a');
        if (!link) return;
        const href = link.getAttribute('href');
        if (href && href.startsWith('#!')) {
          e.preventDefault();
          const page = href.substring(2);
          transitionTo(page, true);
        }
      });

      window.addEventListener('popstate', () => {
        const page = location.hash.substring(2) || 'home';
        transitionTo(page, false);
      });

      const initialPage = location.hash.substring(2) || 'home';
      current = null;               (async () => {
        const html = await load(initialPage);
        setInnerHTML(html);
        inner.classList.add('swipe-in-active');
        current = initialPage;
        if (location.hash) history.replaceState(null, '', `#!${initialPage}`);
      })();

      const textElement = document.getElementById('txt');
      const paths = document.querySelectorAll('.ink');
      const svgElement = document.getElementById('logo');
      let animationTimer = null;
      let isAnimating = false;
      let index = 0;

      function preparePaths() {
        paths.forEach(path => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = length + ' ' + length;
          path.style.strokeDashoffset = length;
          path.style.transition = 'none';
        });
      }

      function animateNext() {
        if (index >= paths.length) {
          isAnimating = false;
          textElement.classList.add('active');
          return;
        }
        const path = paths[index];
        const length = path.getTotalLength();
        path.style.transition = 'stroke-dashoffset 0.2s ease-in-out';
        void path.offsetWidth;
        path.style.strokeDashoffset = '0';
        index++;
        animationTimer = setTimeout(animateNext, 200);
      }

      function resetAnimation() {
        if (animationTimer) {
          clearTimeout(animationTimer);
          animationTimer = null;
        }
        index = 0;
        isAnimating = false;
        paths.forEach(path => {
          const length = path.getTotalLength();
          path.style.strokeDasharray = length + ' ' + length;
          path.style.strokeDashoffset = length;
          path.style.transition = 'none';
        });
        textElement.classList.remove('active');
        textElement.classList.add('exit');
        svgElement.classList.add('swipe-exit');
        void document.body.offsetWidth;
        setTimeout(() => {
          textElement.classList.remove('exit');
          svgElement.classList.remove('swipe-exit');
          setTimeout(animateNext, 200);
        }, 600);
      }

      preparePaths();
      setTimeout(animateNext, 400);
    </script>
