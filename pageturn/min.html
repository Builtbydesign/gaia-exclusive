            overflow: hidden;

        section img {
            width: 100%;
            height: 100%;

            margin: 0;
            display: block;
        }
        section div {
            position: absolute;
            bottom: 50px;
            right: 50px;
            color: #fff;
            z-index: 99;
        }
        section:after {
            content: '';
            display: block;
            height: 200px;
            width: 100%;
            position: absolute;
            bottom: 0;
            background: linear-gradient(0deg,rgba(0, 0, 0, 0.5) 0%, rgba(0, 0, 0, 0) 100%);
            background-blend-mode: overlay;
            z-index: 1;
        }

        #logo:before {

            height: 400px;
            width: 400px;
            position: absolute;
            top: -200px;
            left:-200px;
