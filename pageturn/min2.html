<!doctype html>
<html lang="en">
<head>
  <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
  <title>gaia · exclusive</title>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

  <style>
    @font-face {
      font-family: 'Montserrat-Regular';
      src: url('font/Montserrat-Regular.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'LibreBaskerville-Regular';
      src: url('font/LibreBaskerville-Regular.otf') format('opentype');
      font-display: swap;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }

    body {
      background: #555;
      color: #eee;
      font-family: 'Montserrat-Regular', system-ui, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.2) 100%);
      pointer-events: none;
      z-index: 1000;
    }

    h1, h2, h3, h4 {
      font-family: 'LibreBaskerville-Regular', serif;
      font-weight: normal;
    }
    a { color: #ffc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    li { list-style: none; }

    /* Logo — fixed, always on top of everything */
    #logo {
      position: fixed;
      top: 0;
      left: 0;
      width: 200px;
      height: 130px;
      z-index: 10000;
      pointer-events: none;
    }
    #logo::before {
      content: '';
      display: block;
      position: absolute;
      top: -200px;
      left: -200px;
      width: 400px;
      height: 400px;
      transform: rotate(45deg);
      background: linear-gradient(90deg,
        rgba(0,0,0,0.9) 0%,
        rgba(0,0,0,0) 100%);
      z-index: -1;
    }
    #logo svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Nav — fixed, but below the flipbook section */
    header.container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 999;
    }
    ul#places {
      margin: 100px 0 0 0;
      padding: 20px;
      width: 230px;
      line-height: 24px;
      text-indent: 1em;
      text-align: left;
      position: relative;
    }
    ul#places li a {
      display: block;
      font-size: 1em;
      color: #fff;
    }
    ul#places li a:hover { color: #ffc; }
    #logo svg text, ul#places {
      text-shadow: 0 2px 2px rgba(0,0,0,0.7);
    }

    /* Sections */
    section {
      position: relative;
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0 auto;
      padding: 0;
    }
    section img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    section .textbox {
      position: absolute;
      right: 50px;
      bottom: 50px;
      color: #fff;
      z-index: 99;
      line-height: 1.4em;
    }
    section .textbox h1 { margin: 0 0 8px; }
    section .textbox h2 {
      margin: 0 0 16px;
      font-size: 1em;
      opacity: 0.75;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    section .textbox p { line-height: 1.4em; max-width: 320px; }

    /* Flipbook section — sits above the nav (999), below the logo (10000) */
    section.foot {
      height: auto;
      min-height: 100vh;
      padding: 120px 0 80px;
      background: #555;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
      z-index: 1000;
    }

    #flipbook {
      width: 600px;
      height: 600px;
      background: #888;
      position: relative;
    }

    #controls {
      display: flex;
      gap: 24px;
      align-items: center;
      justify-content: center;
    }
    #controls button {
      background: transparent;
      border: none;
      color: #fff;
      font-family: monospace;
      font-size: 2em;
      padding: 0 12px;
      cursor: pointer;
    }
    #controls button:hover:not(:disabled) { color: #ffc; }
    #controls button:disabled { opacity: 0.35; cursor: not-allowed; }
    #counter {
      font-size: 13px;
      min-width: 70px;
      text-align: center;
      color: #fff;
    }

    #loader {
      letter-spacing: 0.5em;
      text-transform: uppercase;
      font-size: 12px;
      opacity: 0.7;
    }
    #loader[hidden] { display: none; }

    #additional {
      margin: 2em;
    }
    #additional a {
      background: #333;
      padding: 1em;
      margin: 2em auto;
    }

    #fullscreen {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 32px;
      height: 32px;
      padding: 0;
      background: transparent;
      border: none;
      z-index: 10001;
      cursor: pointer;
    }
    #fullscreen svg { width: 100%; height: 100%; fill: #fff; }
    #fullscreen svg:last-child { display: none; }
    body.fullscreen #fullscreen svg:first-child { display: none; }
    body.fullscreen #fullscreen svg:last-child  { display: block; }

    @media (max-width: 700px) {
      #flipbook { width: 90vw; height: 90vw; }
      section .textbox { right: 24px; bottom: 24px; }
      section .textbox h1 { font-size: 24px; }
    }
  </style>
</head>
<body>

  <button id="fullscreen" aria-label="Fullscreen">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">

    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M14,14H19V16H16V19H14V14M5,14H10V19H8V16H5V14M8,5H10V10H5V8H8V5M19,8V10H14V5H16V8H19Z"/>

  <div id="logo">

            fill="#fff" filter="url(#filter1)"/>
      <text x="240" y="290" fill="#fff" font-size="36">exclusive</text>
    </svg>
  </div>

  <header class="container">
    <ul id="places">
      <li><a href="#!the_fort">The Fort</a></li>
      <li><a href="#!ikoma_house">Ikoma House</a></li>
      <li><a href="#!nakweni_villa">Nakweni Porini Villa</a></li>
      <li><a href="#!rubondo_island">Rubondo Island Villa</a></li>
      <li><a href="#!pangani_beach">Beach Under Canvas</a></li>
    </ul>
  </header>

  <section>
    <img src="assets/beach00006.jpeg" alt="Nakweni horse riding">
    <div class="textbox">
      <h1>The Fort, Arusha</h1>
      <h2>Boutique Lodge</h2>
      <p>text goes here</p>
      <a href="#">details</a>
      <a href="#">wildlife</a>
      <a href="#">availability</a>
      <p><a href="#!ikoma_house">next →</a></p>
    </div>
  </section>

  <section class="foot">
    <div id="flipbook"></div>

    <div id="controls">
      <button id="prev" disabled>◀</button>
      <span id="counter">1 / 1</span>
      <button id="next">▶</button>
    </div>

    <div id="loader">Loading…</div>

    <div id="additional">
      <a href="#">1</a>
      <a href="#">2</a>
      <a href="#">3</a>
    </div>
  </section>

  <script>
    const fsBtn = document.getElementById('fullscreen');
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen?.();
      } else {
        document.exitFullscreen?.();
      }
    });
    document.addEventListener('fullscreenchange', () => {
      document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
    });
  </script>

</body>
</html>
