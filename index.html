<html lang="en">
<head>

  <style>
    @font-face {
      font-family: 'Montserrat-Regular';
      src: url('font/Montserrat-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: LibreBaskerville-Regular;
      src: url("font/LibreBaskerville-Regular.otf") format("opentype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #333;
      font-family: 'Montserrat-Regular', system-ui, sans-serif;
    }

    #logo {
      display: block;
      width: 200px;
      height: 130px;
      font-family: 'Montserrat-Regular';
      position: relative;
      z-index: 99;
    }
    section {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding: 0;
      margin: 0 auto;
      position: relative;
      z-index: 9;
    }

    header.container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 2;
    }
    section.hero {
      position: relative;
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      margin: 0 auto;
      padding: 0;
      z-index: 1;
    }
    section.hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: fixed;
    }
    section.hero .textbox {
      position: absolute;
      right: 50px;
      bottom: 40px;
      color: #fff;
      z-index: 2;
      margin-bottom: 30px;
      line-height: 1.4em;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    }
    section.hero .textbox h1 { margin: 0 0 8px; }
    section.hero .textbox h2 {
      margin: 0 0 16px;
      font-size: 1em;
      opacity: 0.8;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    section.hero .textbox p { line-height: 1.4em; max-width: 320px; }
    section.hero .textbox a { color: #fff; }

    ul#places {
      font-family: 'Montserrat-Regular';
      margin: -10px 0 0 0;
      padding: 20px;
      line-height: 24px;
      position: relative;
      z-index: 999;
      text-indent: 1em;
      text-align: left;
      width: 230px;
      font-size: 15px;
      list-style: none;
    }
    a { color: #fff; text-decoration: none; }
    a:hover { text-decoration: underline; }

    section.content {
      position: relative;
      height: auto;
      min-height: 100vh;
      background: rgba(0, 0, 0, 0.8) radial-gradient(ellipse at center,
        rgba(0,0,0,0.2) 1%,
        rgba(0,0,0,0.6) 100%);
      z-index: 99999;
      color: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
    }

    #content-inner {
      width: 700px;
      text-align: left;
      margin: 2em 0;
    }
    #content-inner .pagetitle {
      text-align: center;
      margin-bottom: 2em;
    }
    #content-inner .pagetitle h1 {
      font-size: 3em;
      font-style: italic;
      margin: 0.2em 0;
    }
    #content-inner p,
    #content-inner h1,
    #content-inner h2,
    #content-inner h3,
    #content-inner h4 {
      line-height: 30px;
      margin: 1em 0 0 0;
      padding: 0;
    }
    #content-inner h1,
    #content-inner h2,
    #content-inner h3,
    #content-inner h4 {
      font-family: LibreBaskerville-Regular;
      font-weight: normal;
      color: #A84B22;
    }
    #content-inner h1 b,
    #content-inner h2 b { color: #999; }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 8px;
      margin: 1em 0;
    }
    .pagetitle p:first-of-type {
      opacity: 0.5;
      letter-spacing: 2px;
    }
    .ikoma_house .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .nakweni_villa .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stat {
      padding: 8px 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .stats p,
    .stats h2 { margin: 0 !important; }
    .stats p { font-size: 80%; }

    #content-inner img {
      max-width: 200px;
      float: left;
      padding: 10px;
    }
    #content-inner ul {
      margin: 1em;
      padding: 0;
      line-height: 2em;
    }
    .cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 32px;
      margin: 1em 0;
      align-items: start;
    }
    .cols h2 { margin-top: 0; }
    .cols ul { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>
  <header class="container">
    <a href="#!home" id="homelink">
    <div id="logo">

        <text id="txt" x="240" y="290" fill="#fff" font-size="36">exclusive</text>

  </a>

    <ul id="places">
      <li><a href="#!the_fort">The Fort</a></li>
      <li><a href="#!ikoma_house">Ikoma House</a></li>
      <li><a href="#!nakweni_villa">Nakweni Porini Villa</a></li>
      <li><a href="#!rubondo_island">Rubondo Island Villa</a></li>
      <li><a href="#!pangani_beach">Beach Under Canvas</a></li>
    </ul>
  </header>

  <section class="hero">
    <img id="hero-img" src="assets/beach00006.jpeg" alt="">
    <div class="textbox">
      <h1 id="hero-title">The Fort, Arusha</h1>
      <h2 id="hero-subtitle">Boutique Lodge</h2>
    </div>
  </section>

  <section class="content">
    <div id="content-inner"></div>
  </section>

  <script src="js/marked.js"></script>
  <script>
    const body = document.body;
    const cache = {};
    const inner = document.getElementById('content-inner');
    const heroTitle = document.getElementById('hero-title');
    const heroSubtitle = document.getElementById('hero-subtitle');
    const heroImg = document.getElementById('hero-img');

    async function load(page) {
      if (cache[page]) return cache[page];
      try {
        const res = await fetch(`pages/${page}.md`);
        if (!res.ok) throw new Error();
        const raw = await res.text();

        const meta = {};
        const fm = raw.match(/^---\n([\s\S]*?)\n---\n/);
        if (fm) {
          fm[1].split('\n').forEach(line => {
            const i = line.indexOf(':');
            if (i > 0) meta[line.slice(0, i).trim()] = line.slice(i + 1).trim();
          });
        }

        const html = marked(raw.replace(/^---[\s\S]*?---\n/, ''));
        return (cache[page] = {
          html,
          title: meta.title || page,
          subtitle: meta.subtitle || '',
          image: meta.image || '',
          alt: meta.alt || ''
        });
      } catch {
        return (cache[page] = {
          html: marked('# 404\n\nPage not found. [Home](#!home).'),
          title: '404',
          subtitle: '',
          image: '',
          alt: ''
        });
      }
    }

    async function transitionTo(page, push = true) {
      const { html, title, subtitle, image, alt } = await load(page);
      inner.innerHTML = html;
      heroTitle.textContent = title;
      heroSubtitle.textContent = subtitle;
      if (image) {
        heroImg.src = image;
        heroImg.alt = alt;
      }
      body.className = page;
      if (push) history.pushState(null, '', `#!${page}`);
    }

    document.addEventListener('click', e => {
      const link = e.target.closest('a');
      if (!link) return;
      const href = link.getAttribute('href');
      if (href && href.startsWith('#!')) {
        e.preventDefault();
        transitionTo(href.substring(2), true);
      }
    });

    window.addEventListener('popstate', () => {
      const page = location.hash.substring(2) || 'home';
      transitionTo(page, false);
    });

    (async () => {
      const page = location.hash.substring(2) || 'home';
      const { html, title, subtitle, image, alt } = await load(page);
      inner.innerHTML = html;
      heroTitle.textContent = title;
      heroSubtitle.textContent = subtitle;
      if (image) {
        heroImg.src = image;
        heroImg.alt = alt;
      }
      body.className = page;
      if (location.hash) history.replaceState(null, '', `#!${page}`);
    })();
  </script>
</body>
</html>
