    .stat {

      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .stats p,
    .stats h2 {

    .stats p {

    #content img {

    }

      padding: 0;
      line-height: 2em;

    #header {
      display: block;
      text-align: right;
      font-family: 'Montserrat-Regular';
      width: 100%;
      padding: 0 0 20px 0;

    }

    svg#logo {
      width: 250px;
      height: 160px;
      display: block;
      margin: 0;
      overflow: hidden;
      font-family: 'Montserrat-Regular';
    }

    .ink {
      fill: none;
      stroke: #000;
      stroke-linecap: round;
      stroke-linejoin: round;
    }


    ul#places {
      font-family: 'Montserrat-Regular';
      margin: 0;
      padding:0 20px;
      line-height: 24px;
      z-index: 999;
      width: 230px;
      text-align: right;
      list-style: none;
      position: absolute;
      top: 20px;
      right: 0;
    }
    
    ul li a { 
      font-size: 1em; 
      text-decoration: none; 
      cursor: pointer; 
      display: block; 
    }

    #content img {
      width: 100%;
      margin: 1em 0;
    }


    /* ---------- footer ---------- */
    footer {

      padding: 24px 0;

      color: #3A342B;
    }
    .contact strong {

      font-weight: 500;
      letter-spacing: 2px;
      color: #A84B22;
    }
    .contact a {
      color: #2F3A28;
      text-decoration: none;
      border-bottom: 1px dotted #8C7F66;
    }
    .book {
      display: flex;

      align-items: flex-end;
      gap: 6px;
    }
    .book .cta {

      color: #F4EFE3;
      font-family: 'Montserrat-Regular', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;

      padding: 10px 24px;

      text-decoration: none;
      font-weight: 600;
    }
    .book small {

      color: #8C7F66;
      letter-spacing: 1px;
    }

      justify-content: center;
      padding: 10px 48px;

      font-weight: 400;
      font-size: 10px;
      letter-spacing: 3px;

  <script src="js/marked.js"></script>
  <script>
    const body = document.body;
    const cache = {};
    const inner = document.getElementById('content-inner');

    async function load(page) {
      if (cache[page]) return cache[page];
      try {
        const res = await fetch(`pages/${page}.md`);
        if (!res.ok) throw new Error();
        let text = await res.text();
        text = text.replace(/^---[\s\S]*?---\n/, '');
        const html = marked(text);
        cache[page] = html;
        body.className = page;
        return html;
      } catch {
        const fallback = marked(`# 404\n\nPage not found. [Home](#!home).`);
        cache[page] = fallback;
        body.className = page;
        return fallback;
      }
    }

    async function transitionTo(page, push = true) {
      const html = await load(page);
      inner.innerHTML = html;
      body.className = page;
      if (push) history.pushState(null, '', `#!${page}`);
    }

    document.addEventListener('click', e => {
      const link = e.target.closest('a');
      if (!link) return;
      const href = link.getAttribute('href');
      if (href && href.startsWith('#!')) {
        e.preventDefault();
        transitionTo(href.substring(2), true);
      }
    });

    window.addEventListener('popstate', () => {
      const page = location.hash.substring(2) || 'home';
      transitionTo(page, false);
    });

    // Initial load
    (async () => {
      const initialPage = location.hash.substring(2) || 'home';
      const html = await load(initialPage);
      inner.innerHTML = html;
      if (location.hash) history.replaceState(null, '', `#!${initialPage}`);
      body.className = page;
    })();

    // Draw logo paths instantly
    document.querySelectorAll('.ink').forEach(path => {
      const length = path.getTotalLength();
      path.style.strokeDasharray = length + ' ' + length;
      path.style.strokeDashoffset = '0';
    });
  </script>
